apis:
  - name: LocalClarity REST API
    description: >
      REST API for programmatic access to LocalClarity platform data. Six documented
      operations cover profiles, organizations, business locations (returned as Google
      Business Profile location resources), reviews, publishing a review reply to Google or
      Facebook, and Google Business Profile performance insights. Authentication is an API
      key in the Authorization header, generated by an administrator inside the product at
      Reporting > Data Studio > API. LocalClarity publishes its reference as apiDoc rather
      than OpenAPI; the OpenAPI in this repo is an API Evangelist transcription of it.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    humanURL: https://reputationmanager.io/api/assets/apidocs/index.html

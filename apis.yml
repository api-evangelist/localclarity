aid: localclarity
name: LocalClarity
description: >
  LocalClarity is an AI-driven local search management platform for enterprises, agencies,
  and global brands, operated alongside seoClarity and Actonia. It manages Google Business
  Profiles at scale, tracks local rankings and keywords, monitors and responds to reviews
  across 50+ sources with generative-AI response automation and sentiment analysis, and
  manages listing data across Google, Apple Business Connect, Bing, Facebook and Waze in
  90+ countries and 14 languages. Its REST API exposes six documented operations covering
  profiles, organizations, locations, reviews, review replies and Google Business Profile
  performance insights, authenticated with an API key that administrators generate
  themselves from the Data Studio module and send in the Authorization header.
